<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCare - Lembrete de Remédios</title>
    <link rel="stylesheet" href="style.css">
    <script src="remedio.js"></script>
</head>
<body>

    <div class="accessibility-bar">
        <span>Acessibilidade:</span>

        <button class="accessibility-btn" onclick="alterarFonte('menos')">
            A-
        </button>

        <button class="accessibility-btn" onclick="alterarFonte('reset')">
            A
        </button>

        <button class="accessibility-btn" onclick="alterarFonte('mais')">
            A+
        </button>

        <button
            class="accessibility-btn"
            onclick="toggleContraste()"
            style="margin-left: 15px;"
        >
            🌓 Contraste
        </button>
    </div>

    <nav>
        <h1>ElderCare</h1>

        <p>
            <strong>Bem-vindo de volta!</strong><br>
            Extensão Universitária em Ação
        </p>

        <ul>
            <li>
                <a href="index.html">
                    <button class="active">Medicação</button>
                </a>

                <a href="mapa.html">
                    <button>Navegação / UBS</button>
                </a>

                <a href="batePapo.html">
                    <button>Cuidador</button>
                </a>
            </li>
        </ul>
    </nav>

    <section>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Lembrete de Remédios</h2>

            <!-- JS encontra este botão pelo ID -->
            <button
                id="btnAdicionarRemedio"
                class="btn-acao"
                type="button"
            >
                + Adicionar
            </button>
        </div>

        <article id="Lista">
            <ul>
                <li>
                    <span>Remédio 1 - 08:00 AM</span>
                    <button class="btn-acao">Já tomei</button>
                </li>

                <li>
                    <span>Remédio 2 - 12:00 PM</span>
                    <button class="btn-acao">Já tomei</button>
                </li>

                <li>
                    <span>Remédio 3 - 06:00 PM</span>
                    <button class="btn-acao">Já tomei</button>
                </li>
            </ul>
        </article>

        <!-- ID precisa ser "progresso" minúsculo -->
        <article id="progresso" style="margin-top: 10px;">
            <h2>Progresso Diário</h2>

            <progress value="0" max="100"></progress>
        </article>

    </section>

    <aside>
    <h2>Bate-papo com Maria</h2>

    <div class="chat-box" id="chatBox">
        <div class="chat-mensagem">
            <strong>Maria Silva</strong><br>
            Não se esqueça de registrar os remédios após tomar!
        </div>
    </div>

    <div id="sugestoes"></div>

</aside>

    <script src="script.js"></script>

</body>
</html>
